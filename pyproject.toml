[project]
name = "ip_project"
version = "0.1.0"
description = "Disaster Resource Management System"
readme = "README.md"
authors = [
    { name = "devanksinghchaudhary", email = "devanksinghchaudhary@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "blessed>=1.52.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "yaspin>=3.5.1",
]

[project.scripts]
ip-project = "ip_project:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
